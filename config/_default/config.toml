defaultContentLanguage = "en"
theme = "congo"
enableRobotsTXT = true
pagination.pagerSize = 5
rssLimit = 10
summaryLength = 0
metaDataFormat = "yaml"

[outputs]
home = ["HTML", "RSS", "JSON"]

[permalinks]
post = "/:year/:month/:day/:contentbasename/"

[taxonomies]
tag = 'tags'
category = 'categories'
series = 'series'

[services]
  [services.disqus]
    shortname = 'realjenius'